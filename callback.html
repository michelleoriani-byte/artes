<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Autorização concluída</title>
<style>
  body { margin:0; background:#F7F2EA; color:#3D2B1F;
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         display:grid; place-items:center; min-height:100vh; padding:2rem; }
  main { max-width: 34rem; text-align:center; }
  h1 { font-size:1.6rem; margin:0 0 .5rem; }
  p { line-height:1.7; color:#6D5B4F; }
  code { display:block; background:#EFE7DA; padding:1rem; border-radius:6px;
         word-break:break-all; font-size:.95rem; margin:1.5rem 0 .5rem;
         color:#3D2B1F; text-align:left; }
  button { background:#3D2B1F; color:#F7F2EA; border:0; padding:.8rem 1.4rem;
           border-radius:6px; font-size:1rem; cursor:pointer; }
  .erro { color:#A32A21; }
</style>
</head>
<body>
<main>
  <h1>Autorização concluída</h1>
  <p id="msg">Copie o código abaixo e cole na conversa.</p>
  <code id="code">…</code>
  <button id="btn" type="button">Copiar código</button>
</main>
<script>
  const p = new URLSearchParams(location.search);
  const code = p.get('code'), erro = p.get('error');
  const el = document.getElementById('code');
  if (erro) {
    document.getElementById('msg').innerHTML =
      '<span class="erro">A autorização foi recusada ou falhou.</span>';
    el.textContent = erro + (p.get('error_description') ? ' — ' + p.get('error_description') : '');
    document.getElementById('btn').style.display = 'none';
  } else if (code) {
    el.textContent = code;
    document.getElementById('btn').onclick = () => {
      navigator.clipboard.writeText(code);
      document.getElementById('btn').textContent = 'Copiado ✓';
    };
  } else {
    document.getElementById('msg').textContent = 'Nenhum código recebido nesta página.';
    el.style.display = 'none';
    document.getElementById('btn').style.display = 'none';
  }
</script>
</body>
</html>
